name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies (the same ones a reviewer installs) plus test tools
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check src scripts tests main.py
      - name: Tests (entity linking, index methodology, stress engine, pipeline, API over the full crisis replay)
        run: pytest
