# Entity master - who and what the engine can recognise in text.
#
# Matching rules (see src/tremor/nlp/entities.py):
#   aliases    case-insensitive, whole-word. Safe, unambiguous names.
#   exact      case-sensitive, whole-word. Short or capitalised forms ("AMD", "Intel").
#   ambiguous  case-sensitive AND only accepted when the text also carries a finance cue
#              (cashtag, "shares", "earnings", ...) or comes from a finance-specific feed.
#              Stops "Ford" (Christine Blasey Ford) or "Amazon" (the rainforest) polluting signals.
#   cashtags   $TICKER forms used on social media.

index:
  name: TREMOR-20
  description: Mock index of 20 S&P 100 constituents across 8 GICS sectors
  constituents: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, NFLX, DIS, INTC,
                 AMD, PG, KO, COST, BA, LMT, VZ, JPM, XOM, JNJ]

